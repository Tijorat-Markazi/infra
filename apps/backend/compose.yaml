services:
  backend:
    image: ${BACKEND_IMAGE:?Publish a backend image before deploying backend}
    user: "10001:10001"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ./runtime/backend.env
        format: raw
    ports:
      - "127.0.0.1:4321:4321"
    networks: [backendnet]
    volumes:
      - ./data/backend:/app/data
      - ./data/uploads:/app/uploads
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,noexec
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/api/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 1500m
    pids_limit: 256
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
