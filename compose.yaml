name: tijoratmarkazi

services:
  postgres:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    env_file:
      - path: ./runtime/postgres.env
        format: raw
    volumes:
      # PostgreSQL 18 moved PGDATA underneath this version-independent mount.
      - postgres_data:/var/lib/postgresql
    networks: [backendnet]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

volumes:
  postgres_data:

networks:
  backendnet:
  frontendnet:
